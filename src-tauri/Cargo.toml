[package]
name = "lbp-browser"
version = "0.1.0"
description = "Lightweight browser for Windows and Linux"
authors = ["ddaniel1994"]
edition = "2021"

[lib]
name = "lbp_browser_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Windows-specific deps can go here (for example WASAPI/audio work later)

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific deps can go here (for example audio stack work later)

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
